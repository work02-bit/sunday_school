<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جدول مدارس الأحد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold:          #c9a84c;
      --gold-light:    #f0d080;
      --gold-dim:      rgba(201,168,76,0.14);
      --deep:          #0b0f1a;
      --deep2:         #101523;
      --deep3:         #1a2238;
      --card:          rgba(255,255,255,0.038);
      --card-hover:    rgba(201,168,76,0.07);
      --border:        rgba(201,168,76,0.16);
      --border-active: rgba(201,168,76,0.48);
      --text:          #f0ece2;
      --text-muted:    rgba(240,236,226,0.48);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--deep);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ══════════════════════ HEADER ══════════════════════ */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11,15,26,0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 820px;
      margin: 0 auto;
      height: clamp(56px, 10vw, 68px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(14px, 4vw, 24px);
      gap: 12px;
    }
    .header-logo { display: flex; align-items: center; gap: 10px; }
    .logo-circle {
      width: clamp(34px, 8vw, 42px);
      height: clamp(34px, 8vw, 42px);
      border-radius: 50%;
      background: linear-gradient(135deg, #f0d080, #c9a84c);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(16px, 4vw, 20px);
      color: var(--deep);
      font-weight: 900;
      flex-shrink: 0;
      box-shadow: 0 0 18px rgba(201,168,76,0.3);
    }
    .logo-text {
      font-family: 'Amiri', serif;
      font-size: clamp(15px, 3.5vw, 18px);
      font-weight: 700;
      color: var(--gold-light);
      line-height: 1;
    }
    .logo-sub {
      font-size: clamp(9px, 2vw, 11px);
      color: var(--text-muted);
      margin-top: 3px;
    }
    .header-date {
      font-size: clamp(10px, 2.2vw, 12px);
      color: var(--text-muted);
      text-align: left;
      direction: ltr;
      white-space: nowrap;
      display: none;
    }
    @media (min-width: 480px) { .header-date { display: block; } }

    /* ══════════════════════ PAGE ══════════════════════ */
    .page {
      max-width: 820px;
      margin: 0 auto;
      padding: clamp(16px, 4vw, 32px) clamp(12px, 3.5vw, 20px) 100px;
    }

    /* ══════════════════════ HERO STRIP ══════════════════════ */
    .hero-strip {
      background: linear-gradient(135deg, rgba(201,168,76,0.09), rgba(78,140,222,0.07));
      border: 1px solid var(--border);
      border-radius: clamp(14px, 3vw, 20px);
      padding: clamp(16px, 4vw, 26px) clamp(16px, 4vw, 28px);
      margin-bottom: clamp(16px, 3.5vw, 26px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .hero-title {
      font-family: 'Amiri', serif;
      font-size: clamp(17px, 4.5vw, 22px);
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 4px;
    }
    .hero-sub { font-size: clamp(11px, 2.5vw, 12px); color: var(--text-muted); }
    .hero-count { display: flex; gap: clamp(12px, 3vw, 20px); flex-shrink: 0; }
    .count-chip { text-align: center; }
    .count-num {
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 900;
      background: linear-gradient(135deg, #f0d080, #c9a84c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    .count-label { font-size: clamp(9px, 2vw, 10px); color: var(--text-muted); margin-top: 3px; }

    /* ══════════════════════ ACCORDION ══════════════════════ */
    .classes { display: flex; flex-direction: column; gap: clamp(6px, 1.5vw, 10px); }

    .class-item {
      border-radius: clamp(12px, 2.5vw, 16px);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .class-item.open {
      border-color: var(--border-active);
      box-shadow: 0 0 24px rgba(201,168,76,0.08);
    }

    .class-btn {
      width: 100%;
      background: var(--card);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(13px, 3.2vw, 17px) clamp(14px, 3.5vw, 20px);
      transition: background 0.2s;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      gap: 10px;
    }
    .class-btn:hover,
    .class-item.open .class-btn { background: var(--card-hover); }
    .class-btn:active { background: rgba(201,168,76,0.1); }

    .class-btn-left { display: flex; align-items: center; gap: clamp(10px, 2.5vw, 14px); min-width: 0; }

    .class-icon {
      width: clamp(32px, 8vw, 40px);
      height: clamp(32px, 8vw, 40px);
      border-radius: clamp(8px, 2vw, 11px);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(14px, 3.5vw, 17px);
      flex-shrink: 0;
    }

    .class-info { min-width: 0; }
    .class-name {
      font-size: clamp(13px, 3.5vw, 15px);
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .class-servant-preview {
      font-size: clamp(10px, 2.2vw, 11px);
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .class-btn-right { display: flex; align-items: center; gap: clamp(6px, 1.5vw, 10px); flex-shrink: 0; }

    .lessons-badge {
      font-size: clamp(10px, 2.2vw, 11px);
      padding: 3px clamp(7px, 2vw, 10px);
      border-radius: 20px;
      background: var(--gold-dim);
      border: 1px solid rgba(201,168,76,0.22);
      color: var(--gold);
      font-weight: 600;
      white-space: nowrap;
    }
    /* hide badge on very small screens */
    @media (max-width: 340px) { .lessons-badge { display: none; } }

    .arrow {
      width: clamp(22px, 5.5vw, 26px);
      height: clamp(22px, 5.5vw, 26px);
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      color: var(--gold);
      transition: transform 0.3s, background 0.2s;
      flex-shrink: 0;
    }
    .class-item.open .arrow { transform: rotate(180deg); background: var(--gold-dim); }

    /* ══════════════════════ PANEL (smooth expand) ══════════════════════ */
    .class-panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.36s ease;
    }
    .class-panel.open { grid-template-rows: 1fr; }
    .panel-overflow { overflow: hidden; }

    .panel-inner {
      border-top: 1px solid var(--border);
    }

    /* ══════════════════════ MOBILE CARD VIEW ══════════════════════ */
    /* On mobile show lesson cards instead of table */
    .lessons-cards { display: none; }
    .lessons-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    @media (max-width: 600px) {
      .lessons-table-wrap { display: none; }
      .lessons-cards { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
    }

    /* LESSON CARD (mobile) */
    .lesson-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(201,168,76,0.13);
      border-radius: 12px;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .lc-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .lc-date {
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      background: var(--gold-dim);
      border: 1px solid rgba(201,168,76,0.2);
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .lc-illus {
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 20px;
      background: rgba(78,140,222,0.12);
      border: 1px solid rgba(78,140,222,0.22);
      color: #6eb0f0;
      white-space: nowrap;
    }
    .lc-lesson {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }
    .lc-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .lc-servant { font-size: 11px; color: var(--text-muted); }
    .lc-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--gold);
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(201,168,76,0.28);
      padding: 3px 10px;
      border-radius: 6px;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .lc-link:active { background: var(--gold-dim); }

    /* ══════════════════════ DESKTOP TABLE ══════════════════════ */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 460px;
    }
    thead tr { background: rgba(201,168,76,0.07); }
    th {
      padding: 11px 14px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 11px 14px;
      text-align: center;
      color: var(--text);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 12.5px;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(201,168,76,0.04); }

    .source-link {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--gold);
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(201,168,76,0.28);
      padding: 3px 9px;
      border-radius: 6px;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .source-link:hover { background: var(--gold-dim); }

    .illus-badge {
      display: inline-block;
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 20px;
      background: rgba(78,140,222,0.11);
      border: 1px solid rgba(78,140,222,0.22);
      color: #6eb0f0;
      white-space: nowrap;
    }

    /* ══════════════════════ FOOTER ══════════════════════ */
    .footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 10px;
      text-align: center;
      font-size: clamp(10px, 2.5vw, 11px);
      color: var(--text-muted);
      background: rgba(11,15,26,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      z-index: 50;
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-logo">
      <div class="logo-circle">✝</div>
      <div>
        <div class="logo-text">مدارس الأحد</div>
        <div class="logo-sub">كنيسة ابي سيفين والامير تادرس</div>
      </div>
    </div>
    <div class="header-date" id="headerDate"></div>
  </div>
</header>

<div class="page">
  <div class="hero-strip">
    <div>
      <div class="hero-title">جدول الدروس والخدام</div>
      <div class="hero-sub">موسم اغسطس ٢٠٢٦ · اضغط على أي فصل لعرض الجدول</div>
    </div>
    <div class="hero-count">
      <div class="count-chip">
        <div class="count-num">12</div>
        <div class="count-label">فصول</div>
      </div>
      <div class="count-chip">
        <div class="count-num">5</div>
        <div class="count-label">دروس</div>
      </div>
    </div>
  </div>

  <div class="classes" id="classList"></div>
</div>

<div class="footer">Developed by Engineer: Mario Ashraf</div>

<audio id="clickSound">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=click-124467.mp3">
</audio>

<script>
/* ═══════════════════════════════════════════
   وسائل الإيضاح الثابتة — deterministic hash
   لا تعتمد على localStorage أو random
   النتيجة واحدة على أي جهاز في نفس الشهر
═══════════════════════════════════════════ */
const illustrations = ["اسكتش", "صور Ai", "اشغال يدوية", "صور Ai"];

function hashSeed(str) {
  /* djb2 — بسيط وثابت */
  let h = 5381;
  for (let i = 0; i < str.length; i++)
    h = ((h << 5) + h) + str.charCodeAt(i);
  return Math.abs(h);
}

function getIllustration(classKey, lessonIndex) {
  const d   = new Date();
  const key = `${classKey}_${lessonIndex}_${d.getFullYear()}_${d.getMonth() + 1}`;
  const idx = hashSeed(key) % illustrations.length;
  return illustrations[idx];
}

/* ═══════════════ DATA ═══════════════ */
const lessons = [
  { date: "2026-08-07",  lesson: "العذراء والدة الاله",                    source: "https://st-takla.org/books/fr-botros-elbaramosy/ebooks/cyril-quaternity/mary-mother-of-god.html" },
  { date: "2026-08-14", lesson: " العذراء عصا هارون",                      source: "https://st-takla.org/Full-Free-Coptic-Books/His-Holiness-Pope-Shenouda-III-Books-Online/41-Al-Sayeda-Al-3athra2/The-Holy-Virgin-St-Mary__10-Symbols.html" },
  { date: "2026-08-21", lesson: "العذراء المجمرة الذهب",     source: "https://st-takla.org/Full-Free-Coptic-Books/His-Holiness-Pope-Shenouda-III-Books-Online/41-Al-Sayeda-Al-3athra2/The-Holy-Virgin-St-Mary__09-Titles-2.html" },
  { date: "2026-08-28", lesson: " العذراء السماء الثانية",                   source: "" }
];

const data = {
  kg1:  { name: "كي جي 1",              icon: "🌱", color: "#4ade80", servants: ["جوليا بطرس ","بسنت بطرس "," ام كاراس","مريم عاطف"] },
  kg2:  { name: "كي جي 2",              icon: "🌿", color: "#22d3ee", servants: ["ناردين بنيامين "," ميرنا ناجح ","  نانسي عيسي"," رانيا يوسف"] },
  p1:   { name: "أولى ابتدائي",         icon: "📖", color: "#a78bfa", servants: [" نورا مجدي"," مورا القس امونيوس","  مريم هلال","كارولين بنيامين"] },
  p2:   { name: "تانية ابتدائي",        icon: "✏️", color: "#f472b6", servants: ["نعمات ظريف","حنان عاطف","نورا هاني"," اغابي فرج "] },
  p3b:  { name: "تالتة ابتدائي أولاد", icon: "⚽", color: "#38bdf8", servants: [" عماد يوسف","عادل جاد"," عماد يوسف","باسم خلف"] },
  p3g:  { name: "تالتة ابتدائي بنات",  icon: "🌸", color: "#fb7185", servants: ["ايريني مجدي ","بسمة عاطف"," مادونا رضا","مريم فايز"] },
  p4b:  { name: "رابعة ابتدائي أولاد", icon: "🏆", color: "#fbbf24", servants: ["يوسف  جاد"," مينا منتصر"," كيرلس ماهر","يوسف جاد"] },
  p4g:  { name: "رابعة ابتدائي بنات",  icon: "🌺", color: "#e879f9", servants: ["ام مكاريوس","انجي سمير"," مورين بطرس ","فيبي عادل"] },
  p5b:  { name: "خامسة ابتدائي أولاد", icon: "🎯", color: "#34d399", servants: ["فادي سامي"," كرياكوس سعد"," ماريو اشرف"," توماس سمير"] },
  p5g:  { name: "خامسة ابتدائي بنات",  icon: "🦋", color: "#c084fc", servants: [" ماريان تواب","هيلانة","مهرائيل اشرف","مهرائيل خلف"] },
};

/* ═══════════════ SOUND ═══════════════ */
function playSound() {
  const a = document.getElementById('clickSound');
  if (a) { a.currentTime = 0; a.play().catch(() => {}); }
}

/* ═══════════════ DATE HEADER ═══════════════ */
document.getElementById('headerDate').textContent =
  new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

/* ═══════════════ BUILD ACCORDION ═══════════════ */
const list = document.getElementById('classList');
let currentOpen = null;

Object.entries(data).forEach(([key, cls]) => {
  const item = document.createElement('div');
  item.className = 'class-item';

  const servantPreview = cls.servants.slice(0, 2).join('، ') + ' ...';

  /* ── Desktop table rows ── */
  const tableRows = lessons.map((l, i) => {
    const servant = cls.servants[i % cls.servants.length];
    const illus   = getIllustration(key, i);
    return `<tr>
      <td style="color:var(--gold);font-weight:700;">${l.date}</td>
      <td>${servant}</td>
      <td style="text-align:right;padding-right:16px;">${l.lesson}</td>
      <td><a class="source-link" href="${l.source}" target="_blank">فتح ↗</a></td>
      <td><span class="illus-badge">${illus}</span></td>
    </tr>`;
  }).join('');

  /* ── Mobile lesson cards ── */
  const mobileCards = lessons.map((l, i) => {
    const servant = cls.servants[i % cls.servants.length];
    const illus   = getIllustration(key, i);
    return `<div class="lesson-card">
      <div class="lc-top">
        <span class="lc-date">${l.date}</span>
        <span class="lc-illus">${illus}</span>
      </div>
      <div class="lc-lesson">${l.lesson}</div>
      <div class="lc-bottom">
        <span class="lc-servant">👤 ${servant}</span>
        <a class="lc-link" href="${l.source}" target="_blank">فتح ↗</a>
      </div>
    </div>`;
  }).join('');

  item.innerHTML = `
    <button class="class-btn" aria-expanded="false">
      <div class="class-btn-left">
        <div class="class-icon" style="background:${cls.color}1f;border:1px solid ${cls.color}40;">${cls.icon}</div>
        <div class="class-info">
          <div class="class-name">${cls.name}</div>
          <div class="class-servant-preview">${servantPreview}</div>
        </div>
      </div>
      <div class="class-btn-right">
        <span class="lessons-badge">${lessons.length} دروس</span>
        <span class="arrow">▾</span>
      </div>
    </button>

    <div class="class-panel">
      <div class="panel-overflow">
        <div class="panel-inner">

          <!-- Desktop -->
          <div class="lessons-table-wrap">
            <table>
              <thead>
                <tr>
                  <th>التاريخ</th>
                  <th>الخادم</th>
                  <th>الدرس</th>
                  <th>المصدر</th>
                  <th>وسيلة الإيضاح</th>
                </tr>
              </thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>

          <!-- Mobile -->
          <div class="lessons-cards">${mobileCards}</div>

        </div>
      </div>
    </div>`;

  const btn   = item.querySelector('.class-btn');
  const panel = item.querySelector('.class-panel');

  btn.addEventListener('click', () => {
    playSound();
    const isOpen = item.classList.contains('open');

    if (currentOpen && currentOpen !== item) {
      currentOpen.classList.remove('open');
      currentOpen.querySelector('.class-panel').classList.remove('open');
      currentOpen.querySelector('.class-btn').setAttribute('aria-expanded', 'false');
    }

    if (!isOpen) {
      item.classList.add('open');
      panel.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
      currentOpen = item;
      /* scroll to card with a tiny delay so panel starts expanding first */
      setTimeout(() => item.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
    } else {
      item.classList.remove('open');
      panel.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
      currentOpen = null;
    }
  });

  list.appendChild(item);
});
</script>
</body>
</html>
